[project]
name = "content-agents"
version = "0.2.0"
description = "Equipo de agentes de Claude Code para editar contenido: vídeos para redes y textos de blog"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["faster-whisper"]
panel = ["streamlit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "tools*"]
