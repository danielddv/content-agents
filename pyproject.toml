[project]
name = "content-agents"
version = "0.1.0"
description = "Agentes de edición de contenido: vídeos para redes y textos de blog"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["moviepy", "openai-whisper"]
panel = ["streamlit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agents*", "tools*"]
